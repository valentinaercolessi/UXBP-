<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>exploramundo — Detalle del viaje</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <div class="detalle-sticky">
    <header class="reco-header">
      <button type="button" class="back-btn" id="back-btn" aria-label="Volver">
        <img src="assets/icons/back-arrow.svg" alt="">
      </button>
      <h1 class="reco-header-title">Detalle del viaje</h1>
    </header>

    <div class="detalle-sticky-body">
      <h2 class="reco-destination" id="detalle-destination">—</h2>

      <p class="price-label">Anticipá el precio final</p>

      <div class="price-card">
        <div class="price-row">
          <div class="price-current-group">
            <span class="price-current-label">COSTO TOTAL</span>
            <span class="price-current" id="price-current">$0</span>
          </div>
          <div class="price-max-group">
            <span class="price-max-label">TU PRESUPUESTO</span>
            <span class="price-max-row">
              <span class="price-max" id="price-max">$0</span>
              <span class="price-max-extra" id="price-max-extra" hidden></span>
            </span>
          </div>
        </div>
        <div class="price-track">
          <div class="price-fill" id="price-fill"></div>
        </div>
      </div>

      <hr class="reco-divider">
    </div>
  </div>

  <main class="content reco-content detalle-content">

    <h3 class="section-subtitle">Lo esencial</h3>

    <div class="esencial-card">
      <button type="button" class="esencial-refresh" id="refresh-vuelo" aria-label="Cambiar opción de vuelo">
        <img src="assets/icons/refresh-arrows.svg" alt="">
      </button>

      <div class="esencial-row" id="row-ida">
        <div class="esencial-info">
          <div class="esencial-label">
            <img src="assets/icons/plane-group1.svg" class="esencial-icon esencial-icon-ida" alt="">
            <span>VUELO DE IDA</span>
          </div>
          <p class="esencial-title" id="ida-fecha">—</p>
          <p class="esencial-hora" id="ida-hora">—</p>
          <p class="esencial-sub esencial-sub-small" id="ida-aerolinea">—</p>
          <div class="esencial-detail-row">
            <p class="esencial-detail" id="ida-ruta">—</p>
            <img src="assets/icons/icons-briefcase.svg" class="esencial-extra-icon" alt="Equipaje de mano">
          </div>
        </div>
        <button type="button" class="price-pill price-pill-fixed selected" id="ida-precio">
          <svg class="price-pill-icon price-pill-icon-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5L9.5 17L19 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="price-pill-icon price-pill-icon-plus" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span class="price-pill-amount">$0</span>
        </button>
      </div>

      <hr class="esencial-sep">

      <div class="esencial-row" id="row-vuelta">
        <div class="esencial-info">
          <div class="esencial-label">
            <img src="assets/icons/plane-group1.svg" class="esencial-icon esencial-icon-vuelta" alt="">
            <span>VUELO DE VUELTA</span>
          </div>
          <p class="esencial-title" id="vuelta-fecha">—</p>
          <p class="esencial-hora" id="vuelta-hora">—</p>
          <p class="esencial-sub esencial-sub-small" id="vuelta-aerolinea">—</p>
          <div class="esencial-detail-row">
            <p class="esencial-detail" id="vuelta-ruta">—</p>
            <img src="assets/icons/icons-briefcase.svg" class="esencial-extra-icon" alt="Equipaje de mano">
          </div>
        </div>
        <button type="button" class="price-pill price-pill-fixed selected" id="vuelta-precio">
          <svg class="price-pill-icon price-pill-icon-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5L9.5 17L19 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="price-pill-icon price-pill-icon-plus" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span class="price-pill-amount">$0</span>
        </button>
      </div>
    </div>

    <div class="esencial-card">
      <button type="button" class="esencial-refresh" id="refresh-hotel" aria-label="Cambiar alojamiento">
        <img src="assets/icons/refresh-arrows.svg" alt="">
      </button>

      <div class="esencial-label">
        <img src="assets/icons/house-key.svg" class="esencial-icon" alt="">
        <span>ALOJAMIENTO</span>
      </div>

      <div class="esencial-photo">
        <img id="hotel-photo-img" src="" alt="">
      </div>

      <div class="esencial-row" id="row-hotel">
        <div class="esencial-info">
          <p class="esencial-title" id="hotel-nombre">—</p>
          <p class="esencial-sub" id="hotel-habitacion">—</p>
          <p class="esencial-sub esencial-sub-small" id="hotel-capacidad">—</p>
          <div class="esencial-detail-row">
            <p class="esencial-detail" id="hotel-distancia">—</p>
            <img src="assets/icons/local-cafe.svg" class="esencial-extra-icon" id="detalle-aloj-desayuno" alt="Desayuno incluido">
          </div>
        </div>
        <button type="button" class="price-pill price-pill-fixed selected" id="hotel-precio">
          <svg class="price-pill-icon price-pill-icon-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5L9.5 17L19 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="price-pill-icon price-pill-icon-plus" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span class="price-pill-amount">$0</span>
        </button>
      </div>
    </div>

    <h3 class="section-subtitle">Lo más compartido</h3>

    <div class="shared-card">
      <div class="shared-header">
        <img src="assets/icons/trending-up.svg" class="shared-header-icon" alt="">
        <span>ACTIVIDADES</span>
      </div>
      <div class="shared-scroll" id="actividades-scroll"></div>
    </div>

  </main>

  <button type="button" class="cta-button detalle-guardar" id="guardar-viaje-btn">
    <span>Guardar Viaje</span>
  </button>

  <div class="toast" id="toast"></div>

  <div class="saved-overlay" id="saved-overlay" hidden>
    <div class="saved-card" role="dialog" aria-modal="true" aria-labelledby="saved-title">
      <div class="saved-check">
        <svg viewBox="0 0 55 55" width="55" height="55" aria-hidden="true">
          <circle cx="27.5" cy="27.5" r="27.5" fill="#002fa6"/>
          <path id="saved-check-path" d="M15.5 28.5L23 36.5L39.5 18.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="saved-title" id="saved-title">Tu viaje fue guardado</p>
      <button type="button" class="saved-btn saved-btn-primary" id="saved-ver-viaje">Ver viaje</button>
      <button type="button" class="saved-btn saved-btn-secondary" id="saved-volver-inicio">Volver al inicio</button>
    </div>
  </div>

</div>

<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/detalle.js"></script>
</body>
</html>
