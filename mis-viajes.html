<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>exploramundo — Mis viajes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div class="app-scroll">

  <header class="topbar">
    <img class="logo" src="assets/icons/logo-exploramundo.svg" alt="exploramundo">
  </header>

  <main class="content mv-content">

    <h1 class="mv-title">Mis viajes</h1>

    <div class="mv-segmented" role="tablist" aria-label="Filtro de viajes">
      <button type="button" class="mv-segment" data-segment="activos" role="tab" aria-selected="false">Activos</button>
      <button type="button" class="mv-segment" data-segment="pasados" role="tab" aria-selected="false">Pasados</button>
      <button type="button" class="mv-segment active" data-segment="guardados" role="tab" aria-selected="true">Guardados</button>
    </div>

    <div class="mv-panel" id="mv-panel-activos" hidden>
      <p class="mv-empty">Todavía no tenés viajes activos.</p>
    </div>

    <div class="mv-panel" id="mv-panel-pasados" hidden>
      <p class="mv-empty">Todavía no tenés viajes pasados.</p>
    </div>

    <div class="mv-panel" id="mv-panel-guardados">
      <section class="mv-section" id="mv-section-viables" hidden>
        <h2 class="mv-section-title mv-section-title-viable">
          <img src="assets/icons/auto_awesome-blue.svg" alt="" class="mv-section-icon">
          Viables hoy <span class="mv-count" id="mv-count-viables"></span>
        </h2>
        <div id="mv-list-viables"></div>
      </section>

      <hr class="mv-divider" id="mv-divider" hidden>

      <section class="mv-section" id="mv-section-otras" hidden>
        <h2 class="mv-section-title">Otras opciones <span class="mv-count" id="mv-count-otras"></span></h2>
        <div id="mv-list-otras"></div>
      </section>

      <p class="mv-empty" id="mv-empty-guardados" hidden>Todavía no guardaste ningún viaje. Cuando encuentres uno que te guste, tocá "Guardar Viaje".</p>
    </div>

  </main>

</div>

  <nav class="tabbar" aria-label="Navegación principal">
    <a href="index.html" class="tab" data-page="explorar">
      <img src="assets/icons/icon-explorar-inactive.svg" alt="" class="tab-icon">
      <span>Explorar</span>
    </a>
    <a href="mis-viajes.html" class="tab active" data-page="mis-viajes">
      <img src="assets/icons/icon-map-active-blue.svg" alt="" class="tab-icon">
      <span>Mis viajes</span>
    </a>
    <a href="#" class="tab" data-page="reservar">
      <img src="assets/icons/icon-tag.svg" alt="" class="tab-icon">
      <span>Reservar</span>
    </a>
    <a href="#" class="tab" data-page="mi-perfil">
      <img src="assets/icons/icon-user.svg" alt="" class="tab-icon">
      <span>Mi perfil</span>
    </a>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="mv-confirm-overlay" id="mv-confirm-overlay" hidden>
    <div class="mv-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="mv-confirm-title">
      <p class="mv-confirm-title" id="mv-confirm-title">¿Eliminar viaje guardado?</p>
      <div class="mv-confirm-actions">
        <button type="button" class="mv-confirm-btn" id="mv-confirm-cancel">Cancelar</button>
        <button type="button" class="mv-confirm-btn mv-confirm-btn-destructive" id="mv-confirm-delete">Eliminar</button>
      </div>
    </div>
  </div>

</div>

<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/mis-viajes.js"></script>
</body>
</html>
