<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>exploramundo — Explorar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <div class="explorar-sticky">
    <header class="topbar">
      <img class="logo" src="assets/icons/logo-exploramundo.svg" alt="exploramundo">
    </header>

    <div class="explorar-sticky-body">
      <form class="search-bar" role="search" id="search-form">
        <button type="submit" class="icon-btn" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <input type="text" id="search-input" placeholder="Buscar vuelos, hoteles, destinos" autocomplete="off">
        <button type="button" class="icon-btn" id="mic-btn" aria-label="Buscar por voz">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 11Z"/></svg>
        </button>
      </form>

      <nav class="chips-scroll" aria-label="Filtros de interés">
        <button class="chip" data-chip="montana">
          <img src="assets/icons/terrain.svg" alt="" class="chip-icon">
          <span>Montaña</span>
        </button>
        <button class="chip" data-chip="gastronomia">
          <img src="assets/icons/restaurant.svg" alt="" class="chip-icon">
          <span>Gastronomía</span>
        </button>
        <button class="chip" data-chip="historia">
          <img src="assets/icons/menu_book_group1.svg" alt="" class="chip-icon">
          <span>Historia</span>
        </button>
        <button class="chip" data-chip="arte">
          <img src="assets/icons/palette.svg" alt="" class="chip-icon">
          <span>Arte</span>
        </button>
        <button class="chip chip-plus" id="add-chip" aria-label="Agregar filtro">
          <span>+</span>
        </button>
      </nav>

      <button class="cta-button" id="cta-viable">
        <img src="assets/icons/auto_awesome.svg" alt="" class="cta-icon">
        <span>Viaje más viable</span>
      </button>
    </div>
  </div>

  <main class="content">

    <section class="section">
      <h2 class="section-title">Destinos para vos</h2>
      <div class="card-grid">
        <a class="card" href="#">
          <div class="card-image">
            <img src="assets/images/mendoza.png" alt="Mendoza">
          </div>
          <div class="card-info">
            <h3 class="card-title">Mendoza</h3>
            <p class="card-price">Desde $500.000</p>
          </div>
        </a>
        <a class="card" href="#">
          <div class="card-image">
            <img src="assets/images/panama.png" alt="Panamá">
          </div>
          <div class="card-info">
            <h3 class="card-title">Panamá</h3>
            <p class="card-price">Desde $699.000</p>
          </div>
        </a>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Alojamientos destacados</h2>
      <div class="card-grid">
        <a class="card" href="#">
          <div class="card-image">
            <img src="assets/images/costao-do-santinho.png" alt="Costão do Santinho">
          </div>
          <div class="card-info">
            <h3 class="card-title">Costão do Santinho</h3>
            <p class="card-price">Desde $84.603 /noche</p>
          </div>
        </a>
        <a class="card" href="#">
          <div class="card-image">
            <img src="assets/images/novotel.png" alt="Novotel">
          </div>
          <div class="card-info">
            <h3 class="card-title">Novotel</h3>
            <p class="card-price">Desde $79.999 /noche</p>
          </div>
        </a>
      </div>
    </section>

  </main>

  <nav class="tabbar" aria-label="Navegación principal">
    <a href="index.html" class="tab active" data-page="explorar">
      <img src="assets/icons/tabbar-indicator.svg" alt="" class="tab-icon">
      <span>Inicio</span>
    </a>
    <a href="mis-viajes.html" class="tab" data-page="mis-viajes">
      <img src="assets/icons/icon-map-active.svg" alt="" class="tab-icon">
      <span>Mis viajes</span>
    </a>
    <a href="#" class="tab" data-page="reservar">
      <img src="assets/icons/icon-tag.svg" alt="" class="tab-icon">
      <span>Reservar</span>
    </a>
    <a href="#" class="tab" data-page="mi-perfil">
      <img src="assets/icons/icon-user.svg" alt="" class="tab-icon">
      <span>Mi perfil</span>
    </a>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="viaje-modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">&times;</button>

      <header class="modal-header">
        <img src="assets/icons/auto_awesome-blue.svg" alt="" class="modal-header-icon">
        <h2 id="modal-title">Viaje más viable</h2>
      </header>

      <div class="accordion">
        <section class="accordion-section open" id="section-presupuesto">
          <button type="button" class="accordion-header" aria-expanded="true" aria-controls="body-presupuesto">
            <span class="accordion-title">
              <h3>Presupuesto disponible</h3>
              <span class="accordion-summary" id="summary-presupuesto">Sin definir</span>
            </span>
            <svg class="accordion-chevron" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="accordion-body" id="body-presupuesto">
            <div class="accordion-body-inner">
              <div class="budget-box">
                <div class="budget-value" id="budget-value">$0</div>
                <input type="range" id="budget-slider" class="budget-slider" min="0" max="3000000" step="50000" value="0">
              </div>
            </div>
          </div>
        </section>

        <section class="accordion-section" id="section-fechas">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="body-fechas">
            <span class="accordion-title">
              <h3>Fechas disponibles</h3>
              <span class="accordion-summary" id="summary-fechas">Sin definir</span>
            </span>
            <svg class="accordion-chevron" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="accordion-body" id="body-fechas">
            <div class="accordion-body-inner">
              <div class="calendar-box">
                <div class="calendar-header">
                  <button type="button" class="calendar-nav" id="cal-prev" aria-label="Mes anterior">
                    <img src="assets/icons/chevron-left.svg" alt="">
                  </button>
                  <span class="calendar-month" id="cal-month">Octubre</span>
                  <button type="button" class="calendar-nav" id="cal-next" aria-label="Mes siguiente">
                    <img src="assets/icons/chevron-right.svg" alt="">
                  </button>
                </div>
                <div class="calendar-weekdays">
                  <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
                </div>
                <div class="calendar-grid" id="cal-grid"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="accordion-section" id="section-intereses">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="body-intereses">
            <span class="accordion-title">
              <h3>Intereses</h3>
            </span>
            <svg class="accordion-chevron" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="accordion-body" id="body-intereses">
            <div class="accordion-body-inner">
              <div class="chips-scroll chips-grid" id="modal-chips">
                <button class="chip" data-chip="montana">
                  <img src="assets/icons/terrain.svg" alt="" class="chip-icon">
                  <span>Montaña</span>
                </button>
                <button class="chip" data-chip="historia">
                  <img src="assets/icons/menu_book_group1.svg" alt="" class="chip-icon">
                  <span>Historia</span>
                </button>
                <button class="chip" data-chip="arte">
                  <img src="assets/icons/palette.svg" alt="" class="chip-icon">
                  <span>Arte</span>
                </button>
                <button class="chip" data-chip="gastronomia">
                  <img src="assets/icons/restaurant.svg" alt="" class="chip-icon">
                  <span>Gastronomía</span>
                </button>
                <button class="chip chip-plus" id="modal-add-chip" aria-label="Agregar filtro">
                  <span>+</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="accordion-section" id="section-mente">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="body-mente">
            <span class="accordion-title">
              <h3>Links de referencia</h3>
              <span class="accordion-summary" id="summary-mente">Sin definir</span>
            </span>
            <svg class="accordion-chevron" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="accordion-body" id="body-mente">
            <div class="accordion-body-inner">
              <div class="mente-field">
                <button type="button" class="attach-btn" id="attach-btn" aria-label="Adjuntar archivo">
                  <img src="assets/icons/attachment.svg" alt="">
                </button>
                <input type="text" id="mente-input" placeholder="Un vuelo, hotel, lugar o actividad...">
                <input type="file" id="attach-input" hidden>
              </div>
            </div>
          </div>
        </section>
      </div>

      <button class="cta-button modal-submit" id="buscar-viaje-btn">
        <span>Buscar viaje</span>
      </button>
    </div>
  </div>

  <div class="loader-overlay" id="search-loader" hidden>
    <div class="loader-content">
      <svg class="loader-sparkle" viewBox="0 0 18 18" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path class="loader-sparkle-star loader-sparkle-star-1" d="M14.25 6.75L15.1875 4.6875L17.25 3.75L15.1875 2.8125L14.25 0.75L13.3125 2.8125L11.25 3.75L13.3125 4.6875L14.25 6.75Z" fill="currentColor"/>
        <path class="loader-sparkle-star loader-sparkle-star-2" d="M8.625 7.125L6.75 3L4.875 7.125L0.75 9L4.875 10.875L6.75 15L8.625 10.875L12.75 9L8.625 7.125Z" fill="currentColor"/>
        <path class="loader-sparkle-star loader-sparkle-star-3" d="M14.25 11.25L13.3125 13.3125L11.25 14.25L13.3125 15.1875L14.25 17.25L15.1875 15.1875L17.25 14.25L15.1875 13.3125L14.25 11.25Z" fill="currentColor"/>
      </svg>
      <p class="loader-text">Buscando tu viaje ideal...</p>
    </div>
  </div>

</div>

<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
