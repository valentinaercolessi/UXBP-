<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>exploramundo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app"></div>

<template id="tpl-explorar">

  <div class="explorar-sticky">
    <header class="topbar">
      <img class="logo" src="assets/icons/logo-exploramundo.svg" alt="exploramundo">
    </header>

    <div class="explorar-sticky-body">
      <form class="search-bar" role="search" id="search-form">
        <button type="submit" class="icon-btn" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <input type="text" id="search-input" placeholder="Buscar vuelos, hoteles, destinos" autocomplete="off">
        <button type="button" class="icon-btn" id="mic-btn" aria-label="Buscar por voz">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 11Z"/></svg>
        </button>
      </form>

      <nav class="chips-scroll" aria-label="Filtros de interés">
        <button class="chip" data-chip="montana">
          <img src="assets/icons/terrain.svg" alt="" class="chip-icon">
          <span>Montaña</span>
        </button>
        <button class="chip" data-chip="gastronomia">
          <img src="assets/icons/restaurant.svg" alt="" class="chip-icon">
          <span>Gastronomía</span>
        </button>
        <button class="chip" data-chip="historia">
          <img src="assets/icons/menu_book_group1.svg" alt="" class="chip-icon">
          <span>Historia</span>
        </button>
        <button class="chip" data-chip="arte">
          <img src="assets/icons/palette.svg" alt="" class="chip-icon">
          <span>Arte</span>
        </button>
        <button class="chip chip-plus" id="add-chip" aria-label="Agregar filtro">
          <span>+</span>
        </button>
      </nav>

      <button class="cta-button cta-button-solid" id="cta-viable">
        <img src="assets/icons/auto_awesome.svg" alt="" class="cta-icon">
        <span>Viaje a medida</span>
      </button>
    </div>
  </div>

  <main class="content">

    <section class="section">
      <h2 class="section-title">Destinos para vos</h2>
      <div class="card-grid">
        <a class="card" href="#">
          <div class="card-image">
            <img src="assets/images/mendoza.png" alt="Mendoza">
          </div>
          <div class="card-info">
            <h3 class="card-title">Mendoza</h3>
            <p class="card-price">Desde $500.000</p>
          </div>
        </a>
        <a class="card" href="#">
          <div class="card-image">
            <img src="assets/images/panama.png" alt="Panamá">
          </div>
          <div class="card-info">
            <h3 class="card-title">Panamá</h3>
            <p class="card-price">Desde $699.000</p>
          </div>
        </a>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Alojamientos destacados</h2>
      <div class="card-grid">
        <a class="card" href="#">
          <div class="card-image">
            <img src="assets/images/costao-do-santinho.png" alt="Costão do Santinho">
          </div>
          <div class="card-info">
            <h3 class="card-title">Costão do Santinho</h3>
            <p class="card-price">Desde $84.603 /noche</p>
          </div>
        </a>
        <a class="card" href="#">
          <div class="card-image">
            <img src="assets/images/novotel.png" alt="Novotel">
          </div>
          <div class="card-info">
            <h3 class="card-title">Novotel</h3>
            <p class="card-price">Desde $79.999 /noche</p>
          </div>
        </a>
      </div>
    </section>

  </main>

  <nav class="tabbar" aria-label="Navegación principal">
    <a href="index.html" class="tab active" data-page="explorar">
      <img src="assets/icons/tabbar-indicator.svg" alt="" class="tab-icon">
      <span>Inicio</span>
    </a>
    <a href="mis-viajes.html" class="tab" data-page="mis-viajes">
      <img src="assets/icons/icon-map-active.svg" alt="" class="tab-icon">
      <span>Mis viajes</span>
    </a>
    <a href="#" class="tab" data-page="reservar">
      <img src="assets/icons/icon-tag.svg" alt="" class="tab-icon">
      <span>Reservar</span>
    </a>
    <a href="#" class="tab" data-page="mi-perfil">
      <img src="assets/icons/icon-user.svg" alt="" class="tab-icon">
      <span>Mi perfil</span>
    </a>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="viaje-modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">&times;</button>

      <header class="modal-header">
        <img src="assets/icons/auto_awesome-blue.svg" alt="" class="modal-header-icon">
        <h2 id="modal-title">Viaje a medida</h2>
      </header>

      <div class="accordion">
        <section class="accordion-section open" id="section-presupuesto">
          <button type="button" class="accordion-header" aria-expanded="true" aria-controls="body-presupuesto">
            <span class="accordion-title">
              <h3>Presupuesto disponible</h3>
              <span class="accordion-summary" id="summary-presupuesto">Sin definir</span>
            </span>
            <svg class="accordion-chevron" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="accordion-body" id="body-presupuesto">
            <div class="accordion-body-inner">
              <div class="budget-box">
                <input type="text" inputmode="numeric" class="budget-value" id="budget-value" value="$0" aria-label="Presupuesto disponible">
                <input type="range" id="budget-slider" class="budget-slider" min="0" max="3000000" step="50000" value="0">
              </div>
            </div>
          </div>
        </section>

        <section class="accordion-section" id="section-fechas">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="body-fechas">
            <span class="accordion-title">
              <h3>Fechas disponibles</h3>
              <span class="accordion-summary" id="summary-fechas">Sin definir</span>
            </span>
            <svg class="accordion-chevron" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="accordion-body" id="body-fechas">
            <div class="accordion-body-inner">
              <div class="calendar-box">
                <div class="calendar-header">
                  <button type="button" class="calendar-nav" id="cal-prev" aria-label="Mes anterior">
                    <img src="assets/icons/chevron-left.svg" alt="">
                  </button>
                  <span class="calendar-month" id="cal-month">Octubre</span>
                  <button type="button" class="calendar-nav" id="cal-next" aria-label="Mes siguiente">
                    <img src="assets/icons/chevron-right.svg" alt="">
                  </button>
                </div>
                <div class="calendar-weekdays">
                  <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
                </div>
                <div class="calendar-grid" id="cal-grid"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="accordion-section" id="section-intereses">
          <button type="button" class="accordion-header" aria-expanded="false" aria-controls="body-intereses">
            <span class="accordion-title">
              <h3>Preferencias</h3>
            </span>
            <svg class="accordion-chevron" viewBox="0 0 12 8" fill="none"><path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="accordion-body" id="body-intereses">
            <div class="accordion-body-inner">
              <div class="chips-scroll chips-grid" id="modal-chips">
                <button class="chip" data-chip="montana">
                  <img src="assets/icons/terrain.svg" alt="" class="chip-icon">
                  <span>Montaña</span>
                </button>
                <button class="chip" data-chip="historia">
                  <img src="assets/icons/menu_book_group1.svg" alt="" class="chip-icon">
                  <span>Historia</span>
                </button>
                <button class="chip" data-chip="arte">
                  <img src="assets/icons/palette.svg" alt="" class="chip-icon">
                  <span>Arte</span>
                </button>
                <button class="chip" data-chip="gastronomia">
                  <img src="assets/icons/restaurant.svg" alt="" class="chip-icon">
                  <span>Gastronomía</span>
                </button>
                <button class="chip chip-plus" id="modal-add-chip" aria-label="Agregar filtro">
                  <span>+</span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>

      <button class="cta-button modal-submit" id="buscar-viaje-btn">
        <span>Buscar viaje</span>
      </button>
    </div>
  </div>

  <div class="loader-overlay" id="search-loader" hidden>
    <div class="loader-content">
      <svg class="loader-sparkle" viewBox="0 0 18 18" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path class="loader-sparkle-star loader-sparkle-star-1" d="M14.25 6.75L15.1875 4.6875L17.25 3.75L15.1875 2.8125L14.25 0.75L13.3125 2.8125L11.25 3.75L13.3125 4.6875L14.25 6.75Z" fill="currentColor"/>
        <path class="loader-sparkle-star loader-sparkle-star-2" d="M8.625 7.125L6.75 3L4.875 7.125L0.75 9L4.875 10.875L6.75 15L8.625 10.875L12.75 9L8.625 7.125Z" fill="currentColor"/>
        <path class="loader-sparkle-star loader-sparkle-star-3" d="M14.25 11.25L13.3125 13.3125L11.25 14.25L13.3125 15.1875L14.25 17.25L15.1875 15.1875L17.25 14.25L15.1875 13.3125L14.25 11.25Z" fill="currentColor"/>
      </svg>
      <p class="loader-text">Buscando tu viaje ideal...</p>
    </div>
  </div>

</template>

<template id="tpl-mis-viajes">

  <div class="mv-page">
    <header class="topbar">
      <img class="logo" src="assets/icons/logo-exploramundo.svg" alt="exploramundo">
    </header>

    <h1 class="mv-title">Mis viajes</h1>

    <div class="mv-segmented" role="tablist" aria-label="Filtro de viajes">
      <button type="button" class="mv-segment" data-segment="activos" role="tab" aria-selected="false">Activos</button>
      <button type="button" class="mv-segment" data-segment="pasados" role="tab" aria-selected="false">Pasados</button>
      <button type="button" class="mv-segment active" data-segment="guardados" role="tab" aria-selected="true">Guardados</button>
    </div>

    <div class="mv-body" id="mv-body">
      <div class="mv-panel" id="mv-panel-activos" hidden>
        <p class="mv-empty">Todavía no tenés viajes activos.</p>
      </div>

      <div class="mv-panel" id="mv-panel-pasados" hidden>
        <p class="mv-empty">Todavía no tenés viajes pasados.</p>
      </div>

      <div class="mv-panel" id="mv-panel-guardados">
        <div id="mv-list-guardados"></div>
        <p class="mv-empty" id="mv-empty-guardados" hidden>Todavía no guardaste ningún viaje. Cuando encuentres uno que te guste, tocá "Guardar Viaje".</p>
      </div>
    </div>
  </div>

  <nav class="tabbar" aria-label="Navegación principal">
    <a href="index.html" class="tab" data-page="explorar">
      <img src="assets/icons/icon-explorar-inactive.svg" alt="" class="tab-icon">
      <span>Inicio</span>
    </a>
    <a href="mis-viajes.html" class="tab active" data-page="mis-viajes">
      <img src="assets/icons/icon-map-active-blue.svg" alt="" class="tab-icon">
      <span>Mis viajes</span>
    </a>
    <a href="#" class="tab" data-page="reservar">
      <img src="assets/icons/icon-tag.svg" alt="" class="tab-icon">
      <span>Reservar</span>
    </a>
    <a href="#" class="tab" data-page="mi-perfil">
      <img src="assets/icons/icon-user.svg" alt="" class="tab-icon">
      <span>Mi perfil</span>
    </a>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="mv-confirm-overlay" id="mv-confirm-overlay" hidden>
    <div class="mv-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="mv-confirm-title">
      <p class="mv-confirm-title" id="mv-confirm-title">¿Eliminar viaje guardado?</p>
      <div class="mv-confirm-actions">
        <button type="button" class="mv-confirm-btn" id="mv-confirm-cancel">Cancelar</button>
        <button type="button" class="mv-confirm-btn mv-confirm-btn-destructive" id="mv-confirm-delete">Eliminar</button>
      </div>
    </div>
  </div>

</template>

<template id="tpl-otras-opciones">

  <div class="oo-page">
    <header class="reco-header">
      <button type="button" class="back-btn" id="back-btn" aria-label="Volver">
        <img src="assets/icons/back-arrow.svg" alt="">
      </button>
      <h1 class="reco-header-title">Otras opciones</h1>
    </header>

    <p class="oo-description" id="oo-description">Los destinos más cercanos al Viaje Recomendado, con flexibilidad en presupuesto y fechas disponibles.</p>

    <div class="oo-body" id="oo-body"></div>
  </div>

  <nav class="tabbar" aria-label="Navegación principal">
    <a href="index.html" class="tab active" data-page="explorar">
      <img src="assets/icons/tabbar-indicator.svg" alt="" class="tab-icon">
      <span>Inicio</span>
    </a>
    <a href="mis-viajes.html" class="tab" data-page="mis-viajes">
      <img src="assets/icons/icon-map-active.svg" alt="" class="tab-icon">
      <span>Mis viajes</span>
    </a>
    <a href="#" class="tab" data-page="reservar">
      <img src="assets/icons/icon-tag.svg" alt="" class="tab-icon">
      <span>Reservar</span>
    </a>
    <a href="#" class="tab" data-page="mi-perfil">
      <img src="assets/icons/icon-user.svg" alt="" class="tab-icon">
      <span>Mi perfil</span>
    </a>
  </nav>

  <div class="toast" id="toast"></div>

</template>

<template id="tpl-viaje-detalle">

  <div class="detalle-sticky">
    <header class="reco-header">
      <button type="button" class="back-btn" id="back-btn" aria-label="Volver">
        <img src="assets/icons/back-arrow.svg" alt="">
      </button>
      <h1 class="reco-header-title">Detalle del viaje</h1>
    </header>

    <div class="detalle-sticky-body">
      <h2 class="reco-destination" id="detalle-destination">—</h2>

      <p class="price-label">Anticipá el precio final</p>

      <div class="price-card">
        <div class="price-row">
          <div class="price-current-group">
            <span class="price-current-label">COSTO TOTAL</span>
            <span class="price-current" id="price-current">$0</span>
          </div>
          <div class="price-max-group">
            <span class="price-max-label-row">
              <span class="price-max-label">TU PRESUPUESTO</span>
              <span class="price-max-extra" id="price-max-extra" hidden></span>
            </span>
            <span class="price-max" id="price-max">$0</span>
          </div>
        </div>
        <div class="price-track">
          <div class="price-fill" id="price-fill"></div>
        </div>
      </div>

      <hr class="reco-divider">
    </div>
  </div>

  <main class="content reco-content detalle-content">

    <h3 class="section-subtitle">Lo esencial</h3>

    <div class="esencial-card">
      <button type="button" class="esencial-refresh" id="refresh-vuelo" aria-label="Cambiar opción de vuelo">
        <img src="assets/icons/refresh-arrows.svg" alt="">
      </button>

      <div class="esencial-row" id="row-ida">
        <div class="esencial-info">
          <div class="esencial-label">
            <img src="assets/icons/plane-group1.svg" class="esencial-icon esencial-icon-ida" alt="">
            <span>VUELO DE IDA</span>
          </div>
          <p class="esencial-title" id="ida-fecha">—</p>
          <p class="esencial-hora" id="ida-hora">—</p>
          <p class="esencial-sub esencial-sub-small" id="ida-aerolinea">—</p>
          <div class="esencial-detail-row">
            <p class="esencial-detail" id="ida-ruta">—</p>
            <img src="assets/icons/icons-briefcase.svg" class="esencial-extra-icon" alt="Equipaje de mano">
          </div>
        </div>
        <button type="button" class="price-pill price-pill-fixed selected" id="ida-precio">
          <svg class="price-pill-icon price-pill-icon-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5L9.5 17L19 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="price-pill-icon price-pill-icon-plus" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span class="price-pill-amount">$0</span>
        </button>
      </div>

      <hr class="esencial-sep">

      <div class="esencial-row" id="row-vuelta">
        <div class="esencial-info">
          <div class="esencial-label">
            <img src="assets/icons/plane-group1.svg" class="esencial-icon esencial-icon-vuelta" alt="">
            <span>VUELO DE VUELTA</span>
          </div>
          <p class="esencial-title" id="vuelta-fecha">—</p>
          <p class="esencial-hora" id="vuelta-hora">—</p>
          <p class="esencial-sub esencial-sub-small" id="vuelta-aerolinea">—</p>
          <div class="esencial-detail-row">
            <p class="esencial-detail" id="vuelta-ruta">—</p>
            <img src="assets/icons/icons-briefcase.svg" class="esencial-extra-icon" alt="Equipaje de mano">
          </div>
        </div>
        <button type="button" class="price-pill price-pill-fixed selected" id="vuelta-precio">
          <svg class="price-pill-icon price-pill-icon-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5L9.5 17L19 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="price-pill-icon price-pill-icon-plus" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span class="price-pill-amount">$0</span>
        </button>
      </div>
    </div>

    <div class="esencial-card">
      <button type="button" class="esencial-refresh" id="refresh-hotel" aria-label="Cambiar alojamiento">
        <img src="assets/icons/refresh-arrows.svg" alt="">
      </button>

      <div class="esencial-label">
        <img src="assets/icons/house-key.svg" class="esencial-icon" alt="">
        <span>ALOJAMIENTO</span>
      </div>

      <div class="esencial-photo">
        <img id="hotel-photo-img" src="" alt="">
      </div>

      <div class="esencial-row" id="row-hotel">
        <div class="esencial-info">
          <p class="esencial-title" id="hotel-nombre">—</p>
          <p class="esencial-sub" id="hotel-habitacion">—</p>
          <p class="esencial-sub esencial-sub-small" id="hotel-capacidad">—</p>
          <div class="esencial-detail-row">
            <p class="esencial-detail" id="hotel-distancia">—</p>
            <img src="assets/icons/local-cafe.svg" class="esencial-extra-icon" id="detalle-aloj-desayuno" alt="Desayuno incluido">
          </div>
        </div>
        <button type="button" class="price-pill price-pill-fixed selected" id="hotel-precio">
          <svg class="price-pill-icon price-pill-icon-check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5L9.5 17L19 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="price-pill-icon price-pill-icon-plus" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span class="price-pill-amount">$0</span>
        </button>
      </div>
    </div>

    <h3 class="section-subtitle">Lo más compartido</h3>

    <div class="shared-card">
      <div class="shared-header">
        <img src="assets/icons/trending-up.svg" class="shared-header-icon" alt="">
        <span>ACTIVIDADES</span>
      </div>
      <div class="shared-scroll" id="actividades-scroll"></div>
    </div>

  </main>

  <button type="button" class="cta-button cta-button-solid detalle-guardar" id="guardar-viaje-btn">
    <span>Guardar Viaje</span>
  </button>

  <div class="toast" id="toast"></div>

  <div class="saved-overlay" id="saved-overlay" hidden>
    <div class="saved-card" role="dialog" aria-modal="true" aria-labelledby="saved-title">
      <div class="saved-check">
        <svg viewBox="0 0 55 55" width="55" height="55" aria-hidden="true">
          <circle cx="27.5" cy="27.5" r="27.5" fill="#002fa6"/>
          <path id="saved-check-path" d="M15.5 28.5L23 36.5L39.5 18.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="saved-title" id="saved-title">Tu viaje fue guardado</p>
      <button type="button" class="saved-btn saved-btn-primary" id="saved-ver-viaje">Ver viaje</button>
      <button type="button" class="saved-btn saved-btn-secondary" id="saved-volver-inicio">Volver al inicio</button>
    </div>
  </div>

</template>

<template id="tpl-viaje-recomendado">

  <div class="reco-page">

    <header class="reco-header">
      <button type="button" class="back-btn" id="back-btn" aria-label="Volver">
        <img src="assets/icons/back-arrow.svg" alt="">
      </button>
      <h1 class="reco-header-title">Viaje Recomendado</h1>
    </header>
